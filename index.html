<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live weather, hourly and 5-day forecast with photography that matches the sky. Uzbek, Russian and English." />
    <meta name="theme-color" content="#F1F4F5" />
    <title>Weather</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://thumb.wikimedia.org" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <!-- Set the theme before React loads, so the page never flashes the wrong colors. -->
    <script>
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("weather:theme"); } catch (e) {}
        var dark = pref === "dark" || ((pref === null || pref === "system") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Weather needs JavaScript to load the forecast.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
